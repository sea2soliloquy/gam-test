<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>어른의 감 — 세상 숫자, 어른이라면 이 정도 감은 있어야죠</title>
<meta name="description" content="만 19세 이상을 위한, 공개 데이터로 만든 추측 게임. 10개 주제, 주제당 5문항.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="pocha">

<main id="app">

  <!-- 연령 확인 ───────────────────────────────── -->
  <section id="view-gate" class="view gate">
    <div class="gate-mark" aria-hidden="true">19</div>
    <h1>어른만 들어오세요</h1>
    <p class="lead">만 19세 이상을 위한 숫자 감각 테스트입니다.<br>만 19세 이상이십니까?</p>
    <div class="actions">
      <button id="btn-adult-yes" class="primary">네, 만 19세 이상입니다</button>
      <button id="btn-adult-no" class="ghost">아니요</button>
    </div>
    <p id="gate-no" class="fineprint" hidden>죄송합니다. 만 19세 이상만 이용할 수 있습니다.</p>
    <p class="credit">배경 사진 <a href="https://commons.wikimedia.org/wiki/File:Pojangmacha_in_Haeundae,_Busan_(917).jpg" target="_blank" rel="noopener">부산광역시</a> ·
      <a href="https://www.kogl.or.kr/info/licenseType1.do" target="_blank" rel="noopener">공공누리 제1유형</a></p>
  </section>

  <!-- 주제 고르기 ──────────────────────────────── -->
  <section id="view-home" class="view" hidden>
    <p id="shared-banner" class="banner" hidden></p>
    <div class="hero">
      <div class="badge-day"><span class="badge-19">19+</span> 공개 데이터</div>
      <h1 id="title">어른의 감</h1>
      <p id="subtitle" class="muted"></p>
      <p class="lead">주제를 하나 고르세요. 5문항, 술 한 잔 비우는 시간이면 끝납니다.</p>
    </div>
    <p id="progress-note" class="fineprint" style="text-align:left"></p>
    <div id="topic-grid" class="grid"></div>
    <p class="fineprint">모든 숫자는 공개 데이터에서 직접 계산했습니다.
      정답 옆의 <b>근거 보기</b>를 누르면 어떻게 셌는지 나옵니다.</p>
    <p class="credit">배경 사진 <a href="https://commons.wikimedia.org/wiki/File:Pojangmacha_in_Haeundae,_Busan_(917).jpg" target="_blank" rel="noopener">부산광역시</a> ·
      <a href="https://www.kogl.or.kr/info/licenseType1.do" target="_blank" rel="noopener">공공누리 제1유형</a></p>
  </section>

  <!-- 문항 ───────────────────────────────────── -->
  <section id="view-quiz" class="view" hidden>
    <button id="btn-back" class="linkish">← 주제 고르기</button>
    <p id="topic-name" class="muted small"></p>
    <div class="progress"><div id="progress-bar"></div></div>
    <p id="q-count" class="muted small"></p>
    <h2 id="q-text"></h2>

    <div id="q-choice" class="choices" hidden></div>

    <div id="q-slider" hidden>
      <output id="slider-out" class="slider-out"></output>
      <input type="range" id="slider" aria-label="추측 값">
      <div class="slider-ends"><span id="slider-min"></span><span id="slider-max"></span></div>
    </div>

    <button id="btn-next" class="primary" disabled>다음</button>
  </section>

  <!-- 결과 ───────────────────────────────────── -->
  <section id="view-result" class="view" hidden>
    <p id="result-topic" class="muted small"></p>
    <div class="score-card">
      <div id="grade-emoji" class="grade-emoji"></div>
      <div id="score" class="score"></div>
      <div id="grade" class="grade"></div>
    </div>

    <div id="ai-comment" class="ai" hidden></div>

    <div id="cards"></div>

    <div id="caveat" class="caveat" hidden></div>
    <p id="source" class="fineprint"></p>

    <div class="actions">
      <button id="btn-share" class="primary">친구에게 보내기</button>
      <button id="btn-more" class="ghost">다른 주제 풀기</button>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
